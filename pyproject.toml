[project]
name = "tianyan-mcp-server"
version = "0.1.0"
description = "Controlled Tianyan quantum backend query and experiment submission MCP server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "cqlib==1.4.0b1",
  "httpx>=0.28,<1",
  "cryptography>=50,<51",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
tianyan-mcp-http = "tianyan_mcp.app:main"
tianyan-mcp-admin = "tianyan_mcp.admin_cli:main"
tianyan-mcp-client = "tianyan_mcp.client_cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tianyan_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.uv.sources]
cqlib = { git = "https://github.com/cq-lib/cqlib", rev = "1d0a2c49ac32712d995f46147dfc5e3c4f4ac8e6", subdirectory = "crates/binding-python" }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
